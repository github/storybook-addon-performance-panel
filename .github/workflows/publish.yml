name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      statuses: write
    environment: production
    concurrency:
      group: release-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npm run version-packages
          publish-script: npx changeset publish
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true
      - name: Configure changeset PR
        if: steps.changesets.outputs['pr-number']
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ steps.changesets.outputs['pr-number'] }}
          gh pr edit "$PR" --add-label "skip changeset"
          sha=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=success \
            -f context=CI \
            -f description="Skipped for version-only PR (code validated on main)"

  canary:
    name: Canary Build
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'canary')
    runs-on: ubuntu-latest
    concurrency:
      group: canary-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Set canary version
        working-directory: packages/storybook-addon-performance-panel
        run: |
          base_version=$(node -p "require('./package.json').version")
          short_sha=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          canary_version="${base_version}-canary.${short_sha}"
          npm version "$canary_version" --no-git-tag-version

      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/storybook-addon-performance-panel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: canary-package
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-canary:
    name: Canary Release
    needs: canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    environment: production
    concurrency:
      group: canary-publish-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: canary-package
          path: ${{ runner.temp }}/canary-package
      - name: Validate canary package
        id: package
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import tarfile

          def reject_constant(value):
              raise ValueError(f"Invalid JSON constant: {value}")

          try:
              archives = list(Path(os.environ["RUNNER_TEMP"]).glob("canary-package/*.tgz"))
              if len(archives) != 1 or not archives[0].is_file():
                  raise ValueError("Expected exactly one canary package archive")
              archive_path = archives[0]
              if "\n" in str(archive_path) or "\r" in str(archive_path):
                  raise ValueError("Archive path must not contain line breaks")
              with tarfile.open(archive_path, "r:gz") as archive:
                  paths = {}
                  manifest = None
                  for entry in archive:
                      parts = entry.name.split("/")
                      if (
                          parts[0] != "package"
                          or any(part in ("", ".", "..") for part in parts)
                          or "\\" in entry.name
                          or entry.type not in (tarfile.REGTYPE, tarfile.AREGTYPE, tarfile.DIRTYPE)
                          or (len(parts) == 1 and not entry.isdir())
                          or entry.name in paths
                      ):
                          raise ValueError(f"Noncanonical or duplicate archive entry: {entry.name!r}")
                      paths[entry.name] = entry.isdir()
                      if entry.name == "package/package.json":
                          if not entry.isfile():
                              raise ValueError("Package manifest must be a regular file")
                          manifest = entry

                  for path in paths:
                      parts = path.split("/")
                      for index in range(1, len(parts)):
                          if paths.get("/".join(parts[:index])) is False:
                              raise ValueError(f"Archive entry has a file as its parent: {path!r}")
                  if manifest is None:
                      raise ValueError("Archive must contain package/package.json")
                  with archive.extractfile(manifest) as source:
                      pkg = json.load(source, parse_constant=reject_constant)

              head_sha = os.environ["PR_HEAD_SHA"]
              version = pkg.get("version") if isinstance(pkg, dict) else None
              if (
                  not isinstance(pkg, dict)
                  or pkg.get("name") != "@github-ui/storybook-addon-performance-panel"
                  or not re.fullmatch(r"[a-f0-9]{40}", head_sha)
                  or not isinstance(version, str)
                  or not re.fullmatch(
                      r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-canary\." + head_sha[:7],
                      version,
                  )
              ):
                  raise ValueError("Unexpected package name or canary version")
              settings = pkg.get("publishConfig", {})
              allowed = {"registry": "https://registry.npmjs.org/", "access": "public"}
              if not isinstance(settings, dict) or any(
                  key not in allowed or value != allowed[key] for key, value in settings.items()
              ):
                  raise ValueError("Unexpected publish settings")
              if "tag" in pkg and pkg["tag"] != "canary":
                  raise ValueError("Unexpected publish tag")

              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  print(f"version={version}", file=output)
                  print(f"archive={archive_path}", file=output)
          except (OSError, tarfile.TarError, ValueError) as error:
              sys.exit(f"::error::Invalid canary archive: {error}")
          PY
      - name: Publish canary
        run: npm publish "$CANARY_ARCHIVE" --ignore-scripts --tag canary --provenance --access public
        env:
          CANARY_ARCHIVE: ${{ steps.package.outputs.archive }}
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CANARY_VERSION: ${{ steps.package.outputs.version }}
        with:
          script: |
            const pkg = '@github-ui/storybook-addon-performance-panel';
            const version = process.env.CANARY_VERSION;
            const marker = '<!-- canary-release-comment -->';
            const body = [
              marker,
              `### 📦 Canary Release`,
              '',
              '| Package | Version |',
              '| --- | --- |',
              `| \`${pkg}\` | [\`${version}\`](https://www.npmjs.com/package/${pkg}/v/${version}) |`,
              '',
              '```sh',
              `npm install ${pkg}@${version}`,
              '```',
              '',
              `_Published from ${context.sha.slice(0, 7)}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
