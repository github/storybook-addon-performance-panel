name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/storybook-addon-performance-panel/dist
          key: deps-${{ github.sha }}

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/storybook-addon-performance-panel/dist
          key: deps-${{ github.sha }}
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/storybook-addon-performance-panel/dist
          key: deps-${{ github.sha }}
      - run: npm run tsc

  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/storybook-addon-performance-panel/dist
          key: deps-${{ github.sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('**/package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx vitest run --project browser
        working-directory: packages/storybook-addon-performance-panel
      - run: npm run benchmark
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: addon-overhead-benchmark
          path: packages/storybook-addon-performance-panel/benchmark-results.json
          if-no-files-found: error
          retention-days: 14

  storybook-compatibility:
    name: Storybook ${{ matrix.storybook-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storybook-version: ['10.6.0', 'next']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Configure Storybook ${{ matrix.storybook-version }}
        run: |
          npm pkg set 'devDependencies.@storybook/react-vite=${{ matrix.storybook-version }}'
          npm pkg set 'dependencies.@storybook/addon-docs=${{ matrix.storybook-version }}' 'dependencies.@storybook/react-vite=${{ matrix.storybook-version }}' 'dependencies.storybook=${{ matrix.storybook-version }}' -w @github-ui/examples-react
          npm pkg set 'dependencies.@storybook/html-vite=${{ matrix.storybook-version }}' 'dependencies.storybook=${{ matrix.storybook-version }}' -w @github-ui/examples-html
          npm pkg set 'dependencies.storybook=${{ matrix.storybook-version }}' -w @github-ui/storybook-config
      - run: npm install --package-lock=false
      - run: npm run tsc
      - run: npm run build
      - run: npm run build-storybook -w @github-ui/examples-react
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1
      - run: npm run build-storybook -w @github-ui/examples-html
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

  ci:
    name: CI
    if: always()
    needs: [install, lint, typecheck, test, storybook-compatibility]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more jobs failed, were cancelled, or skipped"
            exit 1
          fi
